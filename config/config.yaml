# ============================================================
# Chordify Configuration
# An AI-Based Multimodal Music Understanding and
# Automatic Guitar Tab Generation System
#
# Based on the open-source Lamucal project.
# Original: https://github.com/Lamucal/Lamucal
# ============================================================

project_name: Chordify
version: "1.0.0"

# ------------------------------------
# Audio Settings
# ------------------------------------
audio:
  sample_rate: 44100
  n_channel: 2
  sources: 4              # vocal, bass, drum, other

# ------------------------------------
# STFT Settings
# ------------------------------------
spec:
  n_fft: 4096
  hop_length: 1024
  pad: true
  n_time: 256             # frames per chunk for U-Net sliding window

# ------------------------------------
# Source Separation (U-Net)
# ------------------------------------
separate:
  model_name: unet
  model_path: ""          # Set to absolute path of checkpoint, or leave empty
  model:
    conv_n_filters: [16, 32, 64, 128, 256, 512]
    down_activation: ELU
    up_activation: ELU

# ------------------------------------
# Beat / Tempo Detection (BeatNet)
# ------------------------------------
beat:
  model_name: beat
  model_path: ""
  model:
    source: 3
    n_classes: 3
    weights: [0.4, 0.3, 0.3]
    n_freq: 2048
    n_group: 32
    f_layers: 2
    f_nhead: 4
    t_layers: 2
    t_nhead: 4
    d_layers: 2
    d_nhead: 8
    dropout: 0.5

# ------------------------------------
# Chord / Key Recognition (ChordNet)
# ------------------------------------
chord:
  model_name: chord
  model_path: ""
  model:
    n_freq: 2048
    n_classes: 122
    n_group: 32
    f_layers: 5
    f_nhead: 8
    t_layers: 5
    t_nhead: 8
    d_layers: 5
    d_nhead: 8
    dropout: 0.5

# ------------------------------------
# Pitch / Melody Tracking (PitchNet)
# ------------------------------------
pitch:
  model_name: pitch
  model_path: ""
  model:
    n_freq: 2048
    n_channel: 2
    n_classes: 850
    emb_hidden: 16
    wr: 0.3
    pr: 0.02
    n_group: 32
    f_layers: 2
    f_nhead: 8
    t_layers: 2
    t_nhead: 8
    enc_weights: [0.6, 0.4]
    d_layers: 2
    d_nhead: 8
    dropout: 0.5

# ------------------------------------
# Music Structure Segmentation (SegmentNet)
# ------------------------------------
segment:
  model_name: segment
  model_path: ""
  model:
    n_freq: 2048
    n_channel: 2
    n_classes: 10
    emb_hidden: 128
    n_group: 32
    f_layers: 2
    f_nhead: 8
    t_layers: 2
    t_nhead: 8
    d_layers: 2
    d_nhead: 8
    dropout: 0.5

# ------------------------------------
# Lyrics / ASR
# ------------------------------------
lyrics:
  enabled: true
  whisper_model: large-v3      # large-v3 | medium | small | base | tiny (auto-fallback)
  wav2vec2_model: "facebook/wav2vec2-base-960h"
  language: null               # null = auto-detect

# ------------------------------------
# Tempo Estimation (librosa)
# ------------------------------------
tempo:
  hop_length: 1024
